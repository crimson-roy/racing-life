<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Racing Life — Retarget Test</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #11161d;
        color: #fff;
        font-family: Arial, sans-serif;
      }
      #retarget-test {
        position: fixed;
        inset: 0;
      }
      .hud {
        position: fixed;
        left: 18px;
        top: 18px;
        z-index: 10;
        padding: 14px;
        border-radius: 14px;
        background: rgba(8, 10, 14, .82);
        border: 1px solid rgba(255,255,255,.14);
        backdrop-filter: blur(10px);
        min-width: 240px;
      }
      .hud h1 {
        margin: 0 0 6px;
        font-size: 18px;
      }
      .hud p {
        margin: 0 0 12px;
        font-size: 12px;
        opacity: .72;
        line-height: 1.45;
      }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button, select {
        border: 1px solid rgba(255,255,255,.16);
        border-radius: 10px;
        background: #242b35;
        color: white;
        padding: 9px 11px;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        font-size: 11px;
        opacity: .8;
      }
      .hint {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 10;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(8,10,14,.7);
        font-size: 11px;
        opacity: .82;
      }
    </style>
  </head>
  <body>
    <div id="retarget-test"></div>
    <div class="hud">
      <h1>Surprise Uppercut — Prototype Rig</h1>
      <p>
        Local retarget test. This page uses the GLB generated by
        RacingLife-Blender.bat retarget-test.
      </p>
      <div class="controls">
        <button id="play-pause">Pause</button>
        <button id="restart">Restart</button>
        <select id="speed" aria-label="Playback speed">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1.5×</option>
        </select>
      </div>
      <div id="status">Loading retargeted prototype…</div>
    </div>
    <div class="hint">Drag to orbit · wheel to zoom</div>
    <script type="module" src="/src/retarget-test-main.js"></script>
  </body>
</html>
