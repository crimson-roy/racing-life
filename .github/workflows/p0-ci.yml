name: P0 race foundation CI

on:
  push:
    branches:
      - feature/3d-racing-foundation
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run foundation tests
        run: npm test

      - name: Build production bundle
        run: npm run build
