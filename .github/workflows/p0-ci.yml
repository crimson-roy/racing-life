name: P0 race foundation CI

on:
  push:
    branches:
      - feature/3d-racing-foundation
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run foundation tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee p0-test-output.txt

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-test-output
          path: p0-test-output.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Build production bundle
        run: npm run build
